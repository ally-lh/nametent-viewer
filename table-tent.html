<script src="./three-d-stage.js"></script>
<script type="module">
import { makeSheet, mmLabel } from './print-sheet.js';
import { SCALE_RANGE, moveItem, scaleItem, alignItem, resetTent, parseLayout, serializeLayout } from './tent-layout.js';
import { composeTent } from './tent-artwork.js';
import { createFlatView } from './flat-view.js';

// Loading overlay — visible until the first frame is ready; becomes an
// error panel if any step of the setup throws (instead of a blank page).
const loaderEl = document.getElementById('loader');
const loaderMsg = document.getElementById('loaderMsg');
const setStatus = msg => { loaderMsg.textContent = msg; };
function showLoadError(err) {
  console.error('Table tent failed to load', err);
  loaderEl.classList.remove('done');
  loaderEl.classList.add('error');
  document.getElementById('loaderTitle').textContent = 'Couldn’t load the table tent';
  setStatus('Please check your connection and reload.\n' + String(err && err.message ? err.message : err));
}
addEventListener('unhandledrejection', e => showLoadError(e.reason));
addEventListener('error', e => showLoadError(e.error || e.message));

const R = window.__resources || {};
const BG = {
  F: R['bgF'] || 'uploads/grungeFBG-bleed.jpg',
  M: R['bgM'] || 'uploads/grungeMBG-bleed.jpg',
  B: R['bgB'] || 'uploads/ACHNBG-bleed.jpg'
};
const FONT_URL = R['font'] || encodeURI('uploads/Rocket Raccoon Free.otf');
const FONTB_URL = R['fontB'] || 'uploads/pixelmix_bold.ttf';
const FONTB_REG_URL = R['fontBreg'] || 'uploads/pixelmix.ttf';
const CHAR_FILES = [
  'Background Remover from Photoroom.png',
  'Background Remover Image from Photoroom.png',
  'Background Remover Image (1).png',
  'Background Remover Image (2).png',
  'Background Remover Image (3).png',
  'IMG 5619 Background Remover.png',
  'IMG 5620 Background Remover.png',
  'IMG 5621 Background Remover.png',
  'IMG 5626 Background Remover.png',
  'IMG 5630 Background Remover.png',
  'IMG 5631 Background Remover.png'
];
const CHAR_URLS = CHAR_FILES.map((f, i) => R['ch' + i] || encodeURI('uploads/' + f));

// The print sheet: A4 plus 3.175 mm (0.125 in) of bleed on every side,
// 303.35 x 216.35 mm = 3584 x 2556 px at 300 dpi. The A4 trim
// (3508 x 2480 px) is centred on it and the fold runs through the middle.
// The background JPEGs are cropped to exactly this sheet.
const sheet = makeSheet();
const TRIM = sheet.trim;
// Bleed guide on the 3D tent (preview only — never drawn into the download)
const BLEED_TINT = 'rgba(220, 40, 40, 0.32)';
const BLEED_LINE = 'rgba(220, 40, 40, 0.9)';
const LS = { tent: 'tabletent-tent', bg: 'tabletent-bg', name: 'tabletent-name', char: 'tabletent-char',
  bleed: 'tabletent-bleed', layout: 'tabletent-layout', panel: 'tabletent-panel', flat: 'tabletent-flat' };

const $ = id => document.getElementById(id);
$('flatSize').textContent = `${mmLabel(sheet.wMm, sheet.hMm)} · A4 + ${sheet.bleedMm} mm bleed`;
$('dlBleedSize').textContent = `${mmLabel(sheet.wMm, sheet.hMm)} · for the print shop`;
$('dlTrimSize').textContent = `A4 · ${mmLabel(sheet.trimWMm, sheet.trimHMm)} · trimmed`;

const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

setStatus('Loading fonts…');
const faceA = new FontFace('TentFont', `url("${FONT_URL}")`);
await faceA.load();
document.fonts.add(faceA);
let boldOK = false;
try {
  const faceB = new FontFace('PixelMix', `url("${FONTB_URL}")`);
  await faceB.load();
  document.fonts.add(faceB);
  boldOK = true;
} catch (e) {
  // bold ttf rejected by the font sanitizer — fall back to regular + faux-bold stroke
  const faceB = new FontFace('PixelMix', `url("${FONTB_REG_URL}")`);
  await faceB.load();
  document.fonts.add(faceB);
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('could not load image ' + src));
    im.src = src;
  });
}
setStatus('Loading artwork…');
const [imgF, imgM, imgB] = await Promise.all([loadImg(BG.F), loadImg(BG.M), loadImg(BG.B)]);
const backgrounds = { A: { F: imgF, M: imgM }, B: imgB };
const charCache = {};
async function getChar(i) {
  if (!charCache[i]) charCache[i] = await loadImg(CHAR_URLS[i]);
  return charCache[i];
}

// `canvas` is the print-clean composition; everything else samples it.
const canvas = document.createElement('canvas');
canvas.width = sheet.w; canvas.height = sheet.h;
const ctx = canvas.getContext('2d');

// State — every change replaces the value; `layout` is an immutable tree.
let tent = localStorage.getItem(LS.tent) === 'B' ? 'B' : 'A';
let bgKey = localStorage.getItem(LS.bg) === 'M' ? 'M' : 'F';
let name = localStorage.getItem(LS.name) ?? 'Lorraine';
// -1 = custom upload; anything outside the preset range falls back to preset 0.
const validCharSel = v => Number.isInteger(v) && v >= -1 && v < CHAR_URLS.length ? v : 0;
let charSel = validCharSel(parseInt(localStorage.getItem(LS.char), 10));
let customImg = null; // charSel === -1 → custom upload
let layout = parseLayout(localStorage.getItem(LS.layout));
let items = { text: null, char: null }; // where the movable pieces landed (sheet px)
let showBleed = false;

function persist(key, value) {
  try { localStorage.setItem(key, value); }
  catch (e) { console.warn('Could not save ' + key, e); }
}
const saveLayout = () => persist(LS.layout, serializeLayout(layout));

// Flat 2D sheet on the right: shows the clean composition with the bleed
// marked in red, and turns drags into layout updates.
const flatCanvas = $('flatCanvas');
flatCanvas.style.aspectRatio = `${sheet.w} / ${sheet.h}`;
const flat = createFlatView({
  canvas: flatCanvas, sheet, source: canvas,
  onDragMove: (key, dx, dy) => { layout = moveItem(layout, tent, key, dx, dy); scheduleRefresh(); },
  onDragEnd: () => saveLayout(),
});

// The 3D tent samples a separate "view" canvas: the clean composition
// plus, when enabled, the red bleed guide.
const viewCanvas = document.createElement('canvas');
viewCanvas.width = sheet.w; viewCanvas.height = sheet.h;
const vctx = viewCanvas.getContext('2d');

function paintView() {
  vctx.clearRect(0, 0, sheet.w, sheet.h);
  vctx.drawImage(canvas, 0, 0);
  if (!showBleed) return;
  vctx.fillStyle = BLEED_TINT;
  vctx.fillRect(0, 0, sheet.w, TRIM.y);                                    // top
  vctx.fillRect(0, TRIM.y + TRIM.h, sheet.w, sheet.h - TRIM.y - TRIM.h);   // bottom
  vctx.fillRect(0, TRIM.y, TRIM.x, TRIM.h);                                // left
  vctx.fillRect(TRIM.x + TRIM.w, TRIM.y, sheet.w - TRIM.x - TRIM.w, TRIM.h); // right
  vctx.strokeStyle = BLEED_LINE;
  vctx.lineWidth = 3;
  vctx.strokeRect(TRIM.x + 1.5, TRIM.y + 1.5, TRIM.w - 3, TRIM.h - 3);     // cut line
}

const paper = new THREE.MeshPhysicalMaterial({ color: 0xf5f0dc, roughness: 0.92, sheen: 0.4, sheenRoughness: 0.9, sheenColor: 0xffffff });
paper.name = 'paper';
const printFront = new THREE.MeshPhysicalMaterial({ roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.6 });
printFront.name = 'print-front';
const printBack = new THREE.MeshPhysicalMaterial({ roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.6 });
printBack.name = 'print-back';

const srcTex = new THREE.CanvasTexture(viewCanvas);
srcTex.colorSpace = THREE.SRGBColorSpace;
srcTex.anisotropy = 8;
const texFront = srcTex.clone();
const texBack = srcTex.clone();
printFront.map = texFront;
printBack.map = texBack;

// UV windows. Bleed off: each face shows its half of the TRIM area (what the
// cut tent looks like). Bleed on: the whole sheet, so the tinted margins are
// visible around the cut line. Texture v=0 is the bottom row of the image.
function applyTextureWindow() {
  const win = showBleed ? { x: 0, y: 0, w: sheet.w, h: sheet.h } : TRIM;
  const u0 = win.x / sheet.w, uw = win.w / sheet.w;
  const vBottom = (sheet.h - win.y - win.h) / sheet.h, vh = win.h / 2 / sheet.h;
  texFront.repeat.set(uw, vh); texFront.offset.set(u0, vBottom);              // lower half
  texBack.repeat.set(-uw, -vh); texBack.offset.set(u0 + uw, vBottom + 2 * vh); // upper half, rotated 180°
}
applyTextureWindow();

async function currentCharImg() {
  if (tent !== 'B') return null;
  return charSel === -1 ? customImg : getChar(charSel);
}
// Loading a character image can take a while the first time, so a slower
// older refresh could finish after a newer one. Each call takes a ticket and
// only the latest one is allowed to draw.
let refreshTicket = 0;
async function refresh() {
  const ticket = ++refreshTicket;
  const charImg = await currentCharImg();
  if (ticket !== refreshTicket) return; // superseded while the image loaded
  const background = tent === 'A' ? backgrounds.A[bgKey] : backgrounds.B;
  items = composeTent({ ctx, sheet, tent, background, name, charImg, layout, fauxBold: !boldOK });
  paintView();
  texFront.needsUpdate = true;
  texBack.needsUpdate = true;
  flat.setItems(items);
}
// After boot a failed redraw (e.g. a character PNG that will not load) is
// reported in the panel instead of through the fatal loading overlay.
function refreshSafely() {
  return refresh().catch(err => {
    console.error('Could not redraw the tent', err);
    const note = $('dlNote');
    note.classList.add('err');
    note.textContent = 'Could not redraw the tent: ' + (err && err.message ? err.message : err);
  });
}
// Drags and slider moves arrive faster than a full re-composition; coalesce
// them to one refresh per frame.
let refreshQueued = false;
function scheduleRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => { refreshQueued = false; refreshSafely(); });
}
setStatus('Building the tent…');
await refresh();

// Tent geometry in metres: the trimmed A4 sheet folded across the short
// side, so each face is 297 x 105 mm.
const W = sheet.trimWMm / 1000, PANEL = sheet.trimHMm / 2 / 1000, HALF_BASE = 0.045, T = 0.0006;
const tilt = Math.asin(HALF_BASE / PANEL);
const cy = (PANEL / 2) * Math.cos(tilt);
const cz = HALF_BASE - (PANEL / 2) * Math.sin(tilt);

function panel(printMat, meshName) {
  const geo = new THREE.BoxGeometry(W, PANEL, T);
  const mesh = new THREE.Mesh(geo, [paper, paper, paper, paper, printMat, paper]);
  mesh.name = meshName;
  mesh.castShadow = true;
  return mesh;
}

const model = new THREE.Group();
model.name = 'a4-table-tent-on-table';

const wood = new THREE.MeshPhysicalMaterial({ color: 0x9c7a52, roughness: 0.45, clearcoat: 0.5, clearcoatRoughness: 0.35 });
wood.name = 'table-wood';
const TOP_W = 0.5, TOP_D = 0.36, TOP_T = 0.03, LEG_H = 0.14, LEG_R = 0.018;
const top = new THREE.Mesh(new THREE.BoxGeometry(TOP_W, TOP_T, TOP_D), wood);
top.name = 'table-top';
top.position.y = -TOP_T / 2;
model.add(top);
const inX = TOP_W / 2 - 0.07, inZ = TOP_D / 2 - 0.07;
[[-inX, -inZ], [inX, -inZ], [-inX, inZ], [inX, inZ]].forEach(([x, z], i) => {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(LEG_R, LEG_R * 0.8, LEG_H, 24), wood);
  leg.name = 'table-leg-' + (i + 1);
  leg.position.set(x, -TOP_T - LEG_H / 2, z);
  model.add(leg);
});

const tentGrp = new THREE.Group();
tentGrp.name = 'a4-table-tent';
model.add(tentGrp);

const front = panel(printFront, 'front-panel');
front.rotation.x = -tilt;
front.position.set(0, cy, cz);
tentGrp.add(front);

const back = panel(printBack, 'back-panel');
back.rotation.set(tilt, Math.PI, 0);
back.position.set(0, cy, -cz);
tentGrp.add(back);

stage.setObject(model);
stage._camera.position.set(-0.14, 0.16, 0.34);
stage._controls.target.set(0, 0.045, 0);
stage._controls.update();
// First frame is ready — fade the overlay out (kept in the DOM so an error
// later in setup can still surface through it).
requestAnimationFrame(() => { loaderEl.classList.add('done'); flat.resize(); });

// Controls
const btnTentA = $('btnTentA'), btnTentB = $('btnTentB');
const btnF = $('btnF'), btnM = $('btnM');
const nameInput = $('nameInput');
const charGrid = $('charGrid'), customBtn = $('customBtn'), customFile = $('customFile');
const textScale = $('textScale'), charScale = $('charScale');
const btnAlignLeft = $('btnAlignLeft'), btnAlignCenter = $('btnAlignCenter');

CHAR_URLS.forEach((url, i) => {
  const b = document.createElement('button');
  b.title = 'Preset ' + (i + 1);
  const im = document.createElement('img');
  im.src = url; im.loading = 'lazy';
  b.appendChild(im);
  b.onclick = () => { charSel = i; persist(LS.char, i); syncUI(); refreshSafely(); };
  charGrid.appendChild(b);
});

const pct = scale => Math.round(scale * 100);
function syncScaleSlider(input, key) {
  const item = layout[tent][key];
  input.disabled = !item;
  input.value = item ? pct(item.scale) : 100;
  $(input.id + 'Out').textContent = input.value + '%';
}
function syncUI() {
  btnTentA.classList.toggle('on', tent === 'A');
  btnTentB.classList.toggle('on', tent === 'B');
  $('secA').style.display = tent === 'A' ? '' : 'none';
  $('secB').style.display = tent === 'B' ? '' : 'none';
  $('charScaleRow').style.display = tent === 'B' ? '' : 'none';
  btnF.classList.toggle('on', bgKey === 'F');
  btnM.classList.toggle('on', bgKey === 'M');
  [...charGrid.children].forEach((b, i) => b.classList.toggle('on', tent === 'B' && charSel === i));
  customBtn.classList.toggle('on', charSel === -1);
  syncScaleSlider(textScale, 'text');
  syncScaleSlider(charScale, 'char');
  const align = layout[tent].text.align;
  btnAlignLeft.classList.toggle('on', align === 'left');
  btnAlignCenter.classList.toggle('on', align !== 'left');
}

btnTentA.onclick = () => { tent = 'A'; persist(LS.tent, 'A'); syncUI(); refreshSafely(); };
btnTentB.onclick = () => { tent = 'B'; persist(LS.tent, 'B'); syncUI(); refreshSafely(); };
btnF.onclick = () => { bgKey = 'F'; persist(LS.bg, 'F'); syncUI(); refreshSafely(); };
btnM.onclick = () => { bgKey = 'M'; persist(LS.bg, 'M'); syncUI(); refreshSafely(); };

// Layout: size sliders + reset. Positions come from dragging in the flat view.
function bindScaleSlider(input, key) {
  input.min = pct(SCALE_RANGE.min); input.max = pct(SCALE_RANGE.max); input.step = 5;
  input.addEventListener('input', () => {
    layout = scaleItem(layout, tent, key, input.valueAsNumber / 100);
    $(input.id + 'Out').textContent = input.value + '%';
    saveLayout();
    scheduleRefresh();
  });
}
bindScaleSlider(textScale, 'text');
bindScaleSlider(charScale, 'char');
function setAlign(align) {
  layout = alignItem(layout, tent, 'text', align);
  saveLayout(); syncUI(); scheduleRefresh();
}
btnAlignLeft.onclick = () => setAlign('left');
btnAlignCenter.onclick = () => setAlign('center');
$('resetLayout').onclick = () => { layout = resetTent(layout, tent); saveLayout(); syncUI(); refreshSafely(); };

// Bleed guide toggle — affects the 3D preview only; the download stays clean.
const bleedChk = $('bleedChk');
function setBleed(on) {
  showBleed = on;
  bleedChk.checked = on;
  applyTextureWindow();
  paintView();
  texFront.needsUpdate = true;
  texBack.needsUpdate = true;
}
bleedChk.addEventListener('change', () => {
  setBleed(bleedChk.checked);
  persist(LS.bleed, bleedChk.checked ? '1' : '0');
});
if (localStorage.getItem(LS.bleed) === '1') setBleed(true);

function useCustomFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  loadImg(url).then(im => {
    customImg = im; charSel = -1;
    persist(LS.char, '-1');
    syncUI(); refreshSafely();
  }).catch(err => {
    console.error(err);
    $('dlNote').classList.add('err');
    $('dlNote').textContent = 'That file could not be read as an image.';
  });
}
customBtn.onclick = () => customFile.click();
customFile.onchange = () => useCustomFile(customFile.files[0]);
// drag & drop anywhere on the page
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (tent === 'B') useCustomFile(e.dataTransfer.files[0]); });

// if reload landed on custom with no image, fall back to preset 0
if (charSel === -1 && !customImg) charSel = 0;

nameInput.value = name;
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const s = nameInput.selectionStart, en = nameInput.selectionEnd;
    nameInput.value = nameInput.value.slice(0, s) + '\\n' + nameInput.value.slice(en);
    nameInput.selectionStart = nameInput.selectionEnd = s + 2;
    nameInput.dispatchEvent(new Event('input'));
  }
});
nameInput.addEventListener('input', () => {
  name = nameInput.value;
  persist(LS.name, name);
  refreshSafely();
});
syncUI();

// Flat sheet column: collapsible to a thin strip so the 3D view gets the room.
const flatEl = $('flat'), flatToggle = $('flatToggle');
function setFlatCollapsed(closed) {
  flatEl.classList.toggle('collapsed', closed);
  flatToggle.textContent = closed ? 'Show flat sheet' : 'Hide';
  flatToggle.setAttribute('aria-expanded', String(!closed));
  if (!closed) requestAnimationFrame(() => flat.resize());
}
flatToggle.onclick = () => {
  const closed = !flatEl.classList.contains('collapsed');
  setFlatCollapsed(closed);
  persist(LS.flat, closed ? 'closed' : 'open');
};
if (localStorage.getItem(LS.flat) === 'closed') setFlatCollapsed(true);

const panelEl = $('panel'), collapseBtn = $('collapseBtn');
if (localStorage.getItem(LS.panel) === 'closed') { panelEl.classList.add('collapsed'); collapseBtn.textContent = '☰'; collapseBtn.title = 'Expand'; }
collapseBtn.onclick = () => {
  const closed = panelEl.classList.toggle('collapsed');
  collapseBtn.textContent = closed ? '☰' : '−';
  collapseBtn.title = closed ? 'Expand' : 'Collapse';
  persist(LS.panel, closed ? 'closed' : 'open');
};

// PDF export. jsPDF is fetched on first use so it never delays page load;
// the pinned build is integrity-checked like the three.js import map.
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js';
const JSPDF_SRI = 'sha384-ytX5osgYad9GPnagB0k+CxKTir/bsE7AfpzvCnQ7owfeWuDd+2l2y0PSIqRK+z/2';
const PDF_JPEG_QUALITY = 0.95;
let jsPDFLoading = null;
function loadJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPDFLoading) {
    jsPDFLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = JSPDF_URL; s.integrity = JSPDF_SRI; s.crossOrigin = 'anonymous';
      s.onload = () => (window.jspdf && window.jspdf.jsPDF)
        ? resolve(window.jspdf.jsPDF)
        : reject(new Error('PDF library did not initialise'));
      s.onerror = () => { jsPDFLoading = null; reject(new Error('could not download the PDF library — check your connection')); };
      document.head.appendChild(s);
    });
  }
  return jsPDFLoading;
}

// The sheet to print: the full composition (with bleed) or the A4 trim crop.
function sheetFor(withBleed) {
  if (withBleed) return { source: canvas, wMm: sheet.wMm, hMm: sheet.hMm, tag: 'bleed-303x216mm' };
  const c = document.createElement('canvas');
  c.width = TRIM.w; c.height = TRIM.h;
  c.getContext('2d').drawImage(canvas, TRIM.x, TRIM.y, TRIM.w, TRIM.h, 0, 0, TRIM.w, TRIM.h);
  return { source: c, wMm: sheet.trimWMm, hMm: sheet.trimHMm, tag: 'a4-297x210mm' };
}

function fileBase() {
  const who = tent === 'A' ? (bgKey === 'F' ? 'girl' : 'guy') : (charSel === -1 ? 'custom' : 'char' + (charSel + 1));
  const safe = (name.trim() || 'blank').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  return `table-tent-${tent.toLowerCase()}-${who}-${safe}`;
}

const dlBleedBtn = $('dlBleedBtn'), dlTrimBtn = $('dlTrimBtn'), dlNote = $('dlNote');
async function downloadPdf(withBleed) {
  [dlBleedBtn, dlTrimBtn].forEach(b => { b.disabled = true; });
  dlNote.classList.remove('err');
  dlNote.textContent = 'Preparing PDF…';
  try {
    const jsPDF = await loadJsPDF();
    const { source, wMm, hMm, tag } = sheetFor(withBleed);
    const jpeg = source.toDataURL('image/jpeg', PDF_JPEG_QUALITY);
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [wMm, hMm], compress: true });
    doc.addImage(jpeg, 'JPEG', 0, 0, wMm, hMm, undefined, 'FAST');
    doc.save(`${fileBase()}-${tag}.pdf`);
    dlNote.textContent = `Saved ${mmLabel(wMm, hMm)}, ${withBleed ? 'with bleed' : 'A4, no bleed'} · 300 dpi`;
  } catch (err) {
    console.error('PDF export failed', err);
    dlNote.classList.add('err');
    dlNote.textContent = 'PDF export failed: ' + (err && err.message ? err.message : err);
  } finally {
    [dlBleedBtn, dlTrimBtn].forEach(b => { b.disabled = false; });
  }
}
dlBleedBtn.onclick = () => downloadPdf(true);
dlTrimBtn.onclick = () => downloadPdf(false);
</script>
</body>
</html>
